format:
  html:
    page-layout: full
    theme:
      light: flatly
      dark: darkly
    toc: false
    anchor-sections: false
    html-math-method: mathml
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=STIX+Two+Text:wght@500;600&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    include-after-body:
      text: |
        <script>
        (function () {
          var main = document.getElementById("quarto-document-content");
          if (!main) return;
          main.setAttribute("tabindex", "-1");
          var skip = document.createElement("a");
          skip.className = "skip-link";
          skip.href = "#quarto-document-content";
          skip.textContent = "Skip to main content";
          document.body.prepend(skip);
          var themeToggle = document.querySelector(".quarto-color-scheme-toggle");
          if (themeToggle) {
            themeToggle.setAttribute("aria-label", "Toggle color theme");
            themeToggle.setAttribute("role", "button");
            var themeIcon = themeToggle.querySelector(".bi");
            if (themeIcon) themeIcon.setAttribute("aria-hidden", "true");
            themeToggle.addEventListener("keydown", function (event) {
              if (event.key === " ") {
                event.preventDefault();
                themeToggle.click();
              }
            });
          }
          var menuToggle = document.querySelector(".navbar-toggler[role='menu']");
          if (menuToggle) menuToggle.removeAttribute("role");
        })();
        </script>
    css:
      - css/styles.css
      - css/page-style.css
      - css/publications.css
