project:
  type: website
  render:
    - "*.qmd"

website:
  title: "Ruoqing Zhu"
  site-url: "https://teazrq.github.io"
  favicon: files/favicon.ico
  search: false
  navbar:
    title: "Ruoqing Zhu"
    collapse: true
    collapse-below: xl
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: members.qmd
        text: Members
      - href: publications.qmd
        text: Publications
      - href: software.qmd
        text: Software
      - href: teaching.qmd
        text: Teaching
      - href: ai.qmd
        text: AI Projects
    right:
      - href: "https://scholar.google.com/citations?user=uyzMyb8AAAAJ&hl=en"
        text: Google Scholar
      - text: GitHub
        href: https://github.com/teazrq
  page-footer:
    left: "© 2026 Ruoqing Zhu."
    right:
      - text: Google Scholar
        href: "https://scholar.google.com/citations?user=uyzMyb8AAAAJ&hl=en"
      - text: GitHub
